<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Amrina Legacy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF8F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F1D1B; --muted:#6B6560; --body:#4A4541; --line:#DCD6CF; --line-soft:#E9E5E0; --line-faint:#F0ECE7;
  --ground:#FAF8F6; --surface:#FFFFFF; --rose:#7E3F48; --rose-dark:#5E2C34; --rose-soft:#F5EBEC; --rose-faint:#FBF4F5;
  --sage:#2F5240; --sage-soft:#E6EFE9; --sage-faint:#F1F7F3; --amber:#7A4E0E; --amber-soft:#FBF1DE; --grey-soft:#F2EFEC;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--rose)} a:hover{color:var(--rose-dark)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
.serif{font-family:'Playfair Display',Georgia,serif}

/* ---------- Log masuk ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;padding:32px 24px;display:flex;flex-direction:column;gap:18px;text-align:center}
.pin{font:700 28px 'Manrope',sans-serif;letter-spacing:10px;text-align:center;min-height:64px;border-radius:14px;border:2px solid var(--line);width:100%;padding:0 12px}
.pin:focus{border-color:var(--rose);outline:none}

/* ---------- Susun atur ---------- */
.app{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line-soft);padding:28px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:600;color:var(--rose);padding:0 10px}
.brand small{display:block;font-family:'Manrope',sans-serif;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:10px;border:0;background:none;color:#3D3935;font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:var(--grey-soft)}
.nav button[aria-current=page]{background:var(--rose-soft);color:var(--rose);font-weight:700}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{flex:1;min-width:0;padding:36px 40px 56px}
.inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.bnav{display:none}

@media (max-width:820px){
  .side{display:none}
  main{padding:20px 16px 112px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line-soft);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;font-size:12px;font-weight:600;color:var(--body);cursor:pointer}
  .bnav button[aria-current=page]{color:var(--rose);font-weight:700}
  .topbrand{display:flex!important}
}
.topbrand{display:none;justify-content:space-between;align-items:center}

/* ---------- Komponen ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head .sub{font-size:14px;color:var(--muted)}
.head h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:32px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--rose);color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--rose-dark);color:#fff}
.btn.dark{background:var(--ink)} .btn.dark:hover{background:#000}
.btn.green{background:var(--sage)} .btn.green:hover{background:#21402F}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:var(--grey-soft)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:wait}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px}
.pad{padding:20px 22px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.5px}
.stat.dark{background:var(--ink);border-color:var(--ink);color:#fff} .stat.dark .l{color:#D8D2CB}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.qa{min-height:88px;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line-soft);background:var(--surface);text-align:left;cursor:pointer;color:var(--ink)}
.qa:hover{border-color:var(--line)}
.qa .ic{width:46px;height:46px;flex-shrink:0;border-radius:12px;background:var(--grey-soft);display:flex;align-items:center;justify-content:center}
.qa b{display:block;font-size:16px} .qa span.s{font-size:13px;color:var(--body)}
.qa.in{background:var(--sage-faint);border-color:#CFE0D5} .qa.in .ic{background:var(--sage);color:#fff}
.qa.out{background:var(--rose-faint);border-color:#E8D2D5} .qa.out .ic{background:var(--rose);color:#fff}
@media (max-width:520px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.qa{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:112px}.qa span.s{display:none}
  .grid-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px 16px}.stat .v{font-size:21px}.stat .l{font-size:12px}}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>.main{flex:999 1 480px;min-width:0}
.cols>.aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-size:15px}
.item:hover{border-color:var(--line)}
.item .date{width:52px;flex-shrink:0;text-align:center;display:flex;flex-direction:column;line-height:1.2}
.item .date b{font-size:21px} .item .date span{font-size:12px;color:var(--muted);text-transform:uppercase}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .mid b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid span{font-size:13px;color:var(--body)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--grey-soft);color:var(--body)}
.chip.ok{background:var(--sage-soft);color:var(--sage)} .chip.dep{background:var(--amber-soft);color:var(--amber)}
.chip.no{background:#FBEAEA;color:#8A1F1F} .chip.done{background:var(--ink);color:#fff}
.chip.pt{background:var(--amber-soft);color:var(--amber)} .chip.st{background:var(--ink);color:#fff}
.amt-in{color:var(--sage);font-weight:700;white-space:nowrap} .amt-out{color:var(--rose);font-weight:700;white-space:nowrap}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.month{min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 15px 'Manrope',sans-serif;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.linkbox{background:var(--rose-soft);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.linkbox .url{background:#fff;border-radius:10px;padding:12px 14px;font-weight:700;word-break:break-all;font-size:14px}
.row-btn{display:flex;gap:10px} .row-btn>*{flex:1}
.loading{padding:40px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--body);background:var(--grey-soft);border-radius:12px;padding:12px 16px;line-height:1.6}

/* ---------- Borang & modal ---------- */
dialog{border:0;padding:0;border-radius:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--ground);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(31,29,27,.45)}
@media (max-width:600px){dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92vh}}
.m-head{position:sticky;top:0;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 10px;z-index:1}
.m-head h2{font-size:19px;font-weight:700}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--grey-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.m-body{padding:6px 20px 24px;display:flex;flex-direction:column;gap:18px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.f .h{font-size:12px;font-weight:500;color:var(--muted)}
.in,.f input,.f select,.f textarea{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:400 16px 'Manrope',sans-serif;color:var(--ink)}
.f textarea{padding:12px 14px;min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--rose);border-color:var(--rose)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#EFEBE7;border-radius:14px;padding:5px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:46px;border-radius:10px;border:0;background:transparent;color:var(--body);font-size:15px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--rose);color:#fff}
.seg.green button[aria-pressed=true][data-v=Masuk]{background:var(--sage)}
.money{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--rose);border-radius:14px;padding:0 16px;min-height:68px}
.money span{font-size:20px;font-weight:700;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:700 28px 'Manrope',sans-serif;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{border:2px solid var(--rose);background:var(--rose-faint);color:var(--rose);padding:0 15px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--rose);margin:1px 0 0;flex-shrink:0}
.opt:has(input:checked){border:2px solid var(--rose);background:var(--rose-faint);padding:13px 15px}
.opt b{display:block;font-size:15px} .opt span{font-size:13px;color:var(--body)}
.upload{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:12px;border:1px dashed #B79AA0;background:var(--surface);color:var(--rose);font-weight:700;cursor:pointer;padding:6px 12px;text-align:center}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.err{background:#FBEAEA;color:#8A1F1F;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-word}
.itemrow{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;align-items:center}
.itemrow input{min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font:400 15px 'Manrope',sans-serif;width:100%}
.del{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--rose);font-size:20px;line-height:1}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;font-weight:700}
.total b{font-size:22px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:821px){#toast{bottom:32px}}

/* ---------- Slip (cetak A4) ---------- */
.slip{width:794px;min-height:1123px;background:#fff;color:#1F1D1B;padding:52px 58px;display:flex;flex-direction:column;gap:22px;font-size:13px;font-family:'Manrope',sans-serif}
.slip-scroll{overflow:auto;border-radius:12px;border:1px solid var(--line-soft);background:#fff}
.slip-scale{transform-origin:top left}
.slip .hd{display:flex;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:2px solid #1F1D1B}
.slip .hd .nm{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:600;color:#7E3F48}
.slip .grey{color:#4A4541}
.slip .info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 30px;background:#FAF8F6;border-radius:10px;padding:16px 20px}
.slip .info div{display:flex;justify-content:space-between;gap:10px}
.slip .info span{color:#6B6560}
.slip table{width:100%;border-collapse:collapse}
.slip th{text-align:left;font-size:11px;letter-spacing:1px;padding:8px 0;border-bottom:1px solid #1F1D1B}
.slip td{padding:8px 0;border-bottom:1px solid #EEEAE5}
.slip .r{text-align:right}
.slip .tot td{font-weight:700;border-bottom:0}
.slip .net{display:flex;justify-content:space-between;align-items:center;background:#1F1D1B;color:#fff;border-radius:10px;padding:16px 22px}
.slip .net b{font-size:24px}
.slip .sign{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:48px}
.slip .sign div{display:flex;flex-direction:column;gap:5px}
.slip .sign .ln{height:52px;border-bottom:1px solid #1F1D1B}
.slip .ft{padding-top:12px;border-top:1px solid #EEEAE5;color:#6B6560;font-size:11px;display:flex;justify-content:space-between}
#cetak{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body>*:not(#cetak){display:none!important}
  #cetak{display:block!important}
  #cetak .slip{width:210mm;min-height:297mm;padding:14mm 15mm}
}
</style>
</head>
<body>

<!-- ============ LOG MASUK ============ -->
<section id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="serif" style="font-size:30px;font-weight:600;color:var(--rose)">Amrina Legacy</div>
    <div style="color:var(--muted);font-size:14px;margin-top:-10px">Pengurusan Dalaman</div>
    <label for="pin" style="font-weight:700;margin-top:8px">Masukkan PIN admin</label>
    <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required>
    <div class="err" id="loginErr" role="alert" hidden></div>
    <button class="btn" type="submit" id="loginBtn" style="width:100%;min-height:54px">Masuk</button>
    <div style="font-size:12px;color:var(--muted)">Lupa PIN? Buka Google Sheet &gt; menu Amrina Legacy &gt; Tetapkan PIN Admin.</div>
  </form>
</section>

<!-- ============ APP ============ -->
<div class="app" id="app" hidden>
  <nav class="side" aria-label="Menu utama">
    <div class="brand">Amrina Legacy<small>Pengurusan Dalaman</small></div>
    <div class="nav" id="sideNav"></div>
    <div class="bottom nav">
      <button type="button" data-act="panduan"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>Panduan guna</button>
      <button type="button" data-act="keluar"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Log keluar</button>
    </div>
  </nav>
  <main><div class="inner" id="view"></div></main>
  <nav class="bnav" id="bottomNav" aria-label="Menu bawah"></nav>
</div>

<dialog id="modal" aria-labelledby="mTitle"></dialog>
<div id="toast" role="status" hidden></div>
<div id="cetak"></div>

<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbx8a9Jw46LmNvrPDNNSU78fCILfHaBMBVbH230N4bFtFQtJgkxI2ZwQvvQ_Q6pzFtfS-Q/exec';
const LINK_BORANG = (() => {
  try { if (/^https?:$/.test(location.protocol)) return new URL('./', location.href).href; } catch (e) {}
  return 'https://amrinamanagement92.github.io/';
})();
window.addEventListener('error', e => {
  try { const t = document.getElementById('toast'); t.textContent = 'Ralat: ' + (e.message || 'tidak diketahui'); t.hidden = false; } catch (x) {}
});

/* ---------------- Pembantu ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => { const n = parseFloat(String(x ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const rm = (n, dp = 2) => 'RM ' + Number(n || 0).toLocaleString('en-MY', { minimumFractionDigits: dp, maximumFractionDigits: 2 });
const BLN = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
const BLN_PENUH = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
function hariIni() { const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 10); }
const bulanIni = () => hariIni().slice(0, 7);
function tkh(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${+m[3]} ${BLN[+m[2] - 1]} ${m[1]}` : esc(s || '—'); }
function tkhSlip(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(s || ''); }
function namaBulan(ym) { const m = String(ym || '').match(/^(\d{4})-(\d{2})/); return m ? `${BLN_PENUH[+m[2] - 1]} ${m[1]}` : ym; }
function waNo(t) { let d = String(t || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '6' + d; return d; }
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};

let PIN = store.get('al_pin') || '';
let META = { kategori: [], servis: [], statusTempahan: [], syarikat: {} };
let VIEW = 'utama';
const ST = { bulanDuit: bulanIni(), bulanTempahan: bulanIni(), bulanGaji: bulanIni(), tapisPekerja: 'Semua', tapisStatus: 'Semua' };

async function api(action, data = {}) {
  let res;
  try {
    res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data, pin: PIN }) });
  } catch (e) { throw new Error('Tiada sambungan internet. Sila cuba lagi.'); }
  const j = await res.json();
  if (!j.ok) {
    if (/PIN salah|PIN admin belum/.test(j.error) && action !== 'login') { keluar(); }
    throw new Error(j.error || 'Ralat tidak diketahui.');
  }
  return j.data;
}

async function mula() {

function tunjukLogin(msg) {
  $('#app').hidden = true; $('#login').hidden = false;

  setTimeout(() => $('#pin').focus(), 50);
}

}

$('#loginForm').addEventListener('submit', async e => {

    catch (x) { er.textContent = x.message; er.hidden = false; b.disabled = false; b.textContent = 'Simpan'; }

function bacaFail(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.type === 'application/pdf') {
      if (file.size > 5 * 1024 * 1024) return reject(new Error('Fail PDF terlalu besar (maksimum 5MB).'));
      const r = new FileReader(); r.onload = () => resolve({ name: file.name, type: file.type, base64: String(r.result).split(',')[1] });
      r.onerror = () => reject(new Error('Tak dapat baca fail.')); return r.readAsDataURL(file);
    }
    if (!/^image\//.test(file.type)) return reject(new Error('Resit mesti gambar atau PDF.'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve({ name: 'resit.jpg', type: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
    };
    img.onerror = () => reject(new Error('Gambar tidak dapat dibuka. Cuba gambar lain.')); img.src = url;
  });
}

  box.addEventListener('click', e => { if (e.target.classList.contains('del')) { e.target.parentElement.remove(); kira(); } });
  f.addEventListener('input', kira);
  $('#tambahItem').addEventListener('click', () => { baris({ perkara: '', jumlah: '' }); box.lastChild.querySelector('input').focus(); });
  kira();
  f.addEventListener('submit', async e => {
    e.preventDefault(); const b = f.querySelector('button[type=submit]'); const er = f.querySelector('.err');
    const items = [...box.children].map(r => ({ ...r._meta, perkara: r.querySelector('[data-k=perkara]').value.replace(/^\d{2}\/\d{2} · /, '').trim(), jumlah: r.querySelector('[data-k=jumlah]').value })).filter(i => num(i.jumlah) !== 0 || i.perkara);
    if (!items.some(i => num(i.jumlah) > 0)) { er.textContent = 'Sila masukkan sekurang-kurangnya satu jumlah pendapatan.'; er.hidden = false; return; }
    b.disabled = true; b.textContent = 'Menyimpan…'; er.hidden = true;
    try {
      const s = await api('simpanGaji', { idPekerja: id, bulan: d.bulan, items, tarikhBayar: f.tarikhBayar.value,
        potongan: { kwsp: f.pkwsp.value, perkeso: f.pperkeso.value, sip: f.psip.value, pcb: f.ppcb.value },
        majikan: { kwsp: f.mkwsp.value, perkeso: f.mperkeso.value, sip: f.msip.value } });
      toast('Disimpan ✓'); tunjukSlip(s); if (VIEW === 'gaji') viewGaji($('#view'));
    } catch (x) { er.textContent = x.message; er.hidden = false; b.disabled = false; b.textContent = 'Simpan & jana'; }
  });
}

function slipHTML(s) {
  const c = s.syarikat || {}, p = s.pekerja || {}, isPT = s.jenis === 'Part-timer';
  const dash = v => esc(v || '—');
  const pend = isPT
    ? `<table><thead><tr><th style="width:90px">TARIKH</th><th>KERJA / MAJLIS</th><th class="r">RM</th></tr></thead><tbody>
       ${s.items.map(i => `<tr><td>${i.tarikh ? tkhSlip(i.tarikh) : ''}</td><td>${esc(i.perkara)}${i.unit && num(i.unit) !== 1 ? ` (${i.unit} × ${rm(i.kadar)})` : ''}</td><td class="r">${num(i.jumlah).toFixed(2)}</td></tr>`).join('')}
       <tr class="tot"><td></td><td>Jumlah elaun</td><td class="r">${s.kasar.toFixed(2)}</td></tr></tbody></table>`
    : `<table><thead><tr><th>PENDAPATAN</th><th class="r">RM</th></tr></thead><tbody>
       ${s.items.map(i => `<tr><td>${esc(i.perkara)}</td><td class="r">${num(i.jumlah).toFixed(2)}</td></tr>`).join('')}
       <tr class="tot"><td>Jumlah pendapatan</td><td class="r">${s.kasar.toFixed(2)}</td></tr></tbody></table>`;
  const pot = `<table><thead><tr><th>POTONGAN</th><th class="r">RM</th></tr></thead><tbody>
       <tr><td>KWSP (pekerja)</td><td class="r">${s.potongan.kwsp.toFixed(2)}</td></tr><tr><td>PERKESO (pekerja)</td><td class="r">${s.potongan.perkeso.toFixed(2)}</td></tr>
       <tr><td>SIP / EIS (pekerja)</td><td class="r">${s.potongan.sip.toFixed(2)}</td></tr><tr><td>PCB (cukai bulanan)</td><td class="r">${s.potongan.pcb.toFixed(2)}</td></tr>
       <tr class="tot"><td>Jumlah potongan</td><td class="r">${s.jumlahPotongan.toFixed(2)}</td></tr></tbody></table>`;
  return `<div class="slip">
    <div class="hd"><div style="display:flex;flex-direction:column;gap:3px"><div class="nm">${dash(c['Nama Syarikat'] || 'Amrina Legacy')}</div>
      <div class="grey">No. Pendaftaran SSM: ${dash(c['No. SSM'])}</div><div class="grey">${dash(c['Alamat'])}</div>
      <div class="grey">${c['No. Telefon'] ? 'Tel: ' + esc(c['No. Telefon']) + ' · ' : ''}${esc(c['E-mel'] || '')}</div></div>
      <div style="text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0">
        <div style="font-size:18px;font-weight:700;letter-spacing:2px">${isPT ? 'PENYATA ELAUN' : 'SLIP GAJI'}</div>
        ${isPT ? '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#7A4E0E;background:#FBF1DE;padding:3px 10px;border-radius:999px">PEKERJA SAMBILAN</div>' : ''}
        <div class="grey">Bulan: <b style="color:#1F1D1B">${esc(namaBulan(s.bulan))}</b></div>
        <div class="grey">Tarikh bayaran: ${tkhSlip(s.tarikhBayar)}</div><div class="grey">No. rujukan: ${esc(s.rujukan)}</div></div></div>
    <div class="info">
      <div><span>Nama</span><b>${dash(p.nama)}</b></div><div><span>No. Kad Pengenalan</span><b>${dash(p.noKP)}</b></div>
      <div><span>${isPT ? 'Tugas' : 'Jawatan'}</span><b>${dash(p.jawatan)}</b></div>
      <div><span>${isPT ? 'Kadar elaun' : 'Tarikh mula kerja'}</span><b>${isPT ? (p.kadarElaun ? rm(p.kadarElaun) + ' / ' + esc(String(p.kiraanElaun || '').toLowerCase()) : '—') : (p.tarikhMula ? tkhSlip(p.tarikhMula) : '—')}</b></div>
      <div><span>No. KWSP</span><b>${dash(p.noKWSP)}</b></div><div><span>No. PERKESO</span><b>${dash(p.noPERKESO)}</b></div>
      ${isPT ? '' : `<div><span>No. Cukai (LHDN)</span><b>${dash(p.noCukai)}</b></div>`}
      <div><span>Bank</span><b>${p.bank || p.noAkaun ? esc([p.bank, p.noAkaun].filter(Boolean).join(' · ')) : '—'}</b></div></div>
    ${isPT ? pend + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">${pot}
      <table><thead><tr><th>CARUMAN MAJIKAN</th><th class="r">RM</th></tr></thead><tbody><tr><td>KWSP</td><td class="r">${s.majikan.kwsp.toFixed(2)}</td></tr><tr><td>PERKESO</td><td class="r">${s.majikan.perkeso.toFixed(2)}</td></tr><tr><td>SIP / EIS</td><td class="r">${s.majikan.sip.toFixed(2)}</td></tr></tbody></table></div>`
      : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">${pend}${pot}</div>`}
    <div class="net"><span style="font-size:14px;font-weight:600;letter-spacing:1px">${isPT ? 'ELAUN BERSIH DIBAYAR' : 'GAJI BERSIH'}</span><b>${rm(s.bersih)}</b></div>
    ${isPT ? '' : `<div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#4A4541">CARUMAN MAJIKAN (TIDAK DITOLAK DARIPADA GAJI)</div>
      <div class="grey" style="display:flex;gap:28px;flex-wrap:wrap"><span>KWSP: <b style="color:#1F1D1B">${rm(s.majikan.kwsp)}</b></span><span>PERKESO: <b style="color:#1F1D1B">${rm(s.majikan.perkeso)}</b></span><span>SIP / EIS: <b style="color:#1F1D1B">${rm(s.majikan.sip)}</b></span></div></div>`}
    <div class="sign"><div><div class="ln"></div><b>Disediakan oleh</b><span style="color:#6B6560">Nama, jawatan &amp; cop syarikat</span></div>
      <div><div class="ln"></div><b>Diterima oleh</b><span style="color:#6B6560">${dash(p.nama)}</span></div></div>
    <div class="ft"><span>${isPT ? 'Penyata' : 'Slip'} ini dijana oleh sistem ${esc(c['Nama Syarikat'] || 'Amrina Legacy')}.</span><span>Sulit · Untuk kegunaan pekerja sahaja</span></div>
  </div>`;
}

function tunjukSlip(s) {
  ST.slipSemasa = s;
  bukaModal(s.jenis === 'Part-timer' ? 'Penyata Elaun' : 'Slip Gaji', `
    <div class="row-btn"><button class="btn" type="button" data-act="cetakSlip">Cetak / Simpan PDF</button></div>
    <div class="note">Tip: Dalam skrin cetak, pilih <b>“Simpan sebagai PDF”</b> (Save as PDF) untuk dapat fail PDF yang boleh dihantar melalui WhatsApp atau e-mel.</div>
    <div class="slip-scroll" id="slipBox"><div class="slip-scale">${slipHTML(s)}</div></div>`);
  modal.style.width = 'min(880px, calc(100vw - 24px))';
  const fit = () => { const w = $('#slipBox').clientWidth, sc = Math.min(1, w / 794); const el = $('#slipBox .slip-scale'); el.style.transform = `scale(${sc})`; $('#slipBox').style.height = (1123 * sc) + 'px'; };
  requestAnimationFrame(fit);
}
async function lihatSlip(ruj) {
  bukaModal('Slip', '<div class="loading">Sedang memuatkan…</div>');
  try { tunjukSlip(await api('slip', { rujukan: ruj })); } catch (x) { bukaModal('Slip', `<div class="err">${esc(x.message)}</div>`); }
}
function cetakSlip() {
  $('#cetak').innerHTML = slipHTML(ST.slipSemasa);
  const s = ST.slipSemasa, nama = String(s.pekerja.nama || '').replace(/[^\w\s-]/g, '').trim();
  const lama = document.title; document.title = `${s.jenis === 'Part-timer' ? 'Penyata Elaun' : 'Slip Gaji'} ${nama} ${s.bulan}`;
  tutupModal();
  setTimeout(() => { window.print(); document.title = lama; }, 120);
}

/* ---------------- Panduan ---------------- */
function panduan() {
  bukaModal('Panduan guna', `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;line-height:1.6">
    <li><b>Ada duit masuk atau keluar?</b> Tekan <b>Duit Masuk</b> / <b>Duit Keluar</b> di Utama. Taip ringgit, pilih “Untuk apa?”, tekan Simpan.</li>
    <li><b>Pelanggan nak tempah?</b> Hantar <b>pautan borang tempahan</b> melalui WhatsApp. Tempahan masuk sendiri ke menu Tempahan, dan e-mel pemberitahuan dihantar kepada syarikat.</li>
    <li><b>Sahkan tempahan:</b> Menu Tempahan → tekan nama pelanggan → tukar status, isi harga & deposit → Simpan.</li>
    <li><b>Part-timer bekerja?</b> Menu Pekerja → <b>+ Rekod kerja</b> pada nama mereka.</li>
    <li><b>Hujung bulan:</b> Menu Gaji → <b>Jana slip</b> → semak angka → Simpan → <b>Cetak / Simpan PDF</b>.</li>
    <li><b>Tersalah masuk data?</b> Buka Google Sheet “Amrina Legacy – Data” dan betulkan terus dalam tab berkenaan.</li></ol>`);
}

/* ---------------- Klik & ubah (delegasi) ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const d = t.dataset;
  if (d.nav) { tutupModal(); return pergi(d.nav); }
  if (d.tempahan) return bukaTempahan(d.tempahan);
  if (d.editpekerja) return borangPekerja(d.editpekerja);
  if (d.rekodkerja) return borangRekodKerja(d.rekodkerja);
  if (d.janagaji) return janaGaji(d.janagaji);
  if (d.lihatslip) return lihatSlip(d.lihatslip);
  if (d.tapispekerja) { ST.tapisPekerja = d.tapispekerja; return pergi('pekerja'); }
  if (d.tapisstatus) { ST.tapisStatus = d.tapisstatus; return pergi('tempahan'); }
  const grp = t.parentElement && t.parentElement.dataset.pilih;
  if (grp) { t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
  switch (d.act) {
    case 'tutup': return tutupModal();
    case 'keluar': return keluar();
    case 'panduan': return panduan();
    case 'duitMasuk': return borangDuit('Masuk');
    case 'duitKeluar': return borangDuit('Keluar');
    case 'tambahTempahan': return borangTempahanBaru();
    case 'tambahPekerja': return borangPekerja(null);
    case 'cetakSlip': return cetakSlip();
    case 'salinLink':
      return (navigator.clipboard ? navigator.clipboard.writeText(LINK_BORANG) : Promise.reject()).then(() => toast('Pautan disalin ✓')).catch(() => toast(LINK_BORANG));
  }
});
document.addEventListener('change', e => {
  const m = e.target.dataset && e.target.dataset.month;
  if (m && e.target.value) { ST[m] = e.target.value; pergi(VIEW); }
  if (e.target.type === 'file') { const s = e.target.closest('label').querySelector('[data-namafail]'); if (s) s.textContent = e.target.files[0] ? 'Dipilih: ' + e.target.files[0].name : 'Ambil gambar resit (tak wajib)'; }
});
modal.addEventListener('close', () => { modal.style.width = ''; });

mula();
</script>
</body>
</html>
